# Baseline preset for a Kaggle T4 x2 session (§16 Architecture.md).
# Load with: PipelineConfig.from_yaml("configs/baseline.yaml")
work_dir: /kaggle/working/rag_runtime
collection_name: rag_chunks

ingestion:
  max_file_mb: 200
  max_archive_mb: 4096
  max_archive_files: 5000
  skip_unchanged_documents: true

parsing:
  render_dpi: 220
  enable_ocr: true
  ocr_model_name: PaddleOCR-VL-1.6
  ocr_model_dir: null          # Kaggle Dataset path when running offline
  ocr_cuda_visible_devices: null # Notebook tự chọn GPU 1 khi T4 x2
  ocr_images_in_digital_docs: true
  include_hidden_sheets: false
  include_hidden_rows_columns: false
  write_table_parquet: true

ocr_correction:
  enabled: true
  model: Qwen/Qwen2.5-3B-Instruct
  revision: null
  device: null                   # Notebook chon cuda:0 khi T4 x2
  load_in_4bit: true
  temperature: 0.0
  max_new_tokens: 1024
  max_input_tokens: 6000
  max_buffered_components: 8
  max_retries: 1
  fail_open: true
  correct_labels: [doc_title, paragraph_title, text, caption]
  correct_tables: false          # true: sửa theo từng ô, giữ nguyên số hàng/ô, ghi ngược vào rows
  previous_context_chars: 600    # đuôi đoạn liền trước (đã sửa) đưa vào prompt
  segment_chars: 1200            # đoạn dài được sửa theo từng khúc <= giá trị này
  glossary_enabled: false        # danh sách tên chuẩn hoá của document; bật sau khi benchmark
  glossary_max_terms: 20

vision:
  enabled: false               # Bật khi evaluation cho thấy cần hiểu flowchart/dashboard
  model: Qwen/Qwen2.5-VL-3B-Instruct
  revision: null
  load_in_4bit: true
  max_retries: 2
  device: null                   # Notebook tự chọn GPU 0 khi T4 x2

chunking:
  text_chunk_chars: 1800       # ~450 tokens; đoạn cùng mục được gộp, không overlap
  table_inline_max_chars: 6000 # bảng nhỏ hơn: 1 chunk markdown đầy đủ
  table_preview_rows: 5        # bảng lớn: chỉ index preview, bảng đầy đủ lưu .xlsx
  table_preview_columns: 5
  visual_max_chars: 6000       # 1 ảnh = 1 chunk

retrieval:
  # Mục tiêu kiến trúc là BAAI/bge-multilingual-gemma2 (cần query instruction),
  # nhưng trên T4 cùng Qwen 7B nên dùng bge-m3. Không trộn 2 model trong 1 index.
  dense_model: BAAI/bge-m3
  dense_revision: null
  dense_fallback_model: BAAI/bge-m3
  dense_batch_size: 4
  dense_top_k: 30
  sparse_top_k: 30
  rrf_k: 60
  fused_top_k: 30
  rerank_top_k: 8
  reranker_enabled: true
  reranker_model: BAAI/bge-reranker-v2-m3
  reranker_device: cuda          # Notebook đổi thành CPU khi T4 x2
  expand_relationships: true
  neighbor_chunks: 1
  max_table_chars_in_context: 12000
  entity_boost: true

generation:
  model: Qwen/Qwen2.5-7B-Instruct
  revision: null
  load_in_4bit: true
  max_context_chars: 28000
  max_new_tokens: 1024
  temperature: 0.1
  query_rewrite_enabled: false
  query_rewrite_count: 2
  structured_computation_enabled: true
  device: null                   # Notebook tự chọn GPU 0 khi T4 x2

guardrails:
  enabled: true
  min_rerank_score: 0.05
  detect_prompt_injection: true
  mask_pii_in_logs: true
  validate_numbers: true

runtime:
  unload_models_between_stages: true
  log_traces: true
  session_dir: null             # Retrieve notebook đặt ngoài frozen corpus

artifacts:
  include_source_documents: false
  include_parsed_documents: true
